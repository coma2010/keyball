# Workflow: Build firmware on demand in qmk_cli container; pip unlock uses PIP_BREAK_SYSTEM_PACKAGES because Debian base is PEP 668 managed.
name: Build a firmware

on:

  workflow_call:
    inputs:
      qmk_version:
        default: '0.22.14'
        type: string
        required: false
      keyboard:
        type: string
        required: true
      keymap:
        type: string
        required: true

jobs:

  build:

    name: Build a firmware ${{ inputs.keyboard }}:${{ inputs.keymap }}

    runs-on: ubuntu-22.04
    container:
      # Pinned to digest that previously succeeded (log showed sha256:2dc05f...). Avoids newer Python 3.14 image regression.
      image: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07

    steps:

    - name: Checkout source
      uses: actions/checkout@v4

    - name: Checkout qmk_firmware
      uses: ./.github/actions/checkout-qmk_firmware

    - name: Install a link to own source
      run: ln -s $(pwd)/qmk_firmware/keyboards/keyball __qmk__/keyboards/keyball

    - name: Install missing python module
      env:
        PIP_BREAK_SYSTEM_PACKAGES: "1"  # Allow pip installs inside Debian-managed python (uv tool env is managed)
      run: /opt/uv/tools/qmk/bin/python3 -m pip install -r __qmk__/requirements.txt

    - name: Patch qmk math for Python 3.14 ast
      run: |
        python - <<'PY'
        from pathlib import Path
        import ast

        path = Path('__qmk__/lib/python/qmk/math.py')
        text = path.read_text()

        # Idempotent: only patch once.
        if 'NUM_NODE_TYPES' not in text:
            text = text.replace(
                'def _eval(node):',
                'NUM_NODE_TYPES = tuple(t for t in (getattr(ast, "Constant", None), getattr(ast, "Num", None)) if t)\n\n'
                'def _eval(node):'
            )
            text = text.replace('if isinstance(node, (ast.Constant, ast.Num))', 'if isinstance(node, NUM_NODE_TYPES)')
            path.write_text(text)
        PY

    - name: Compile and link
      run: qmk compile -j 4 -kb keyball/${{ inputs.keyboard }} -km ${{ inputs.keymap }}

    - name: Archive built firmware
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
        path: __qmk__/*.hex
